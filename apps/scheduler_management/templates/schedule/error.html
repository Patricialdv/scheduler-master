<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error — UCI Scheduler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', Arial, sans-serif; background: #f5f6fa; min-height: 100vh; }
        .page { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 58px); padding: 32px; }
        .card { background: white; border-radius: 14px; box-shadow: 0 4px 24px rgba(26,26,46,0.08); padding: 40px; max-width: 480px; width: 100%; text-align: center; }
        .icon-wrap { width: 56px; height: 56px; background: #fef2f2; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .material-icons-round { font-size: 28px; color: #dc2626; }
        h2 { font-size: 1.2rem; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
        p { color: #6b7280; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
        a { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: #1a1a2e; color: white; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        a:hover { background: #2d2d5e; }
        a .material-icons-round { font-size: 17px; color: white; }
    </style>
</head>
<body>
{% include "base/navbar.html" %}
<div class="page">
    <div class="card">
        <div class="icon-wrap">
            <span class="material-icons-round">error_outline</span>
        </div>
        <h2>Se produjo un error</h2>
        <p>{{ error_message }}</p>
        <a href="{% url 'schedule_selector' %}">
            <span class="material-icons-round">arrow_back</span> Volver al selector
        </a>
    </div>
</div>
</body>
</html>
